name: Continous Deployment
on:
  push:
    branches:
      - main
    paths:
      - src/**
      - k8s/**
      - package*.json

  workflow_dispatch:
    inputs:
      build:
        description: Trigger build
        type: boolean
        required: false
        default: true
      deploy:
        description: Trigger deploy
        type: boolean
        required: false
        default: true

env:
  REGISTRY: ghcr.io

jobs:
  release:
    outputs:
      tag: ${{ steps.release.outputs.version }}
      released: ${{ steps.release.outputs.releases_created}}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
  build:
    name: Build and push container image
    if: ${{ needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch' }}
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read # needs write permission to push tag and release
      packages: write # needs write permission to publish Docker image
    strategy:
      matrix:
        app: [frontend, backend]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push ${{ matrix.app }} release container image
        if: ${{ needs.release.outputs.released == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}:${{ needs.release.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          platforms: ${{ matrix.platform }}

      - name: Build and push ${{ matrix.app }} container image
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          platforms: ${{ matrix.platform }}

  deploy:
    name: Deploy applications
    if: ${{ needs.release.outputs.released == 'true' || inputs.deploy == true }}
    needs: [release, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.release.outputs.released == 'true' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: read
    env:
      NAMESPACE: ${{ vars.NAMESPACE }}
      DEPLOYMENT_ENV: ${{ needs.release.outputs.released == 'true' && 'prod' || 'dev' }}
    steps:
      - name: Setup Kubectl
        run: |
          kubectl version --client

      - name: Configure Kubectl
        env:
          CLUSTER_CONTEXT: k8s
          CLUSTER_HOST: ${{ secrets.CLUSTER_HOST }}
          CLUSTER_PORT: ${{ secrets.CLUSTER_PORT }}
          SERVICE_ACCOUNT_TOKEN: ${{ secrets.SERVICE_ACCOUNT_TOKEN }}
        run: |
          kubectl config set-cluster "${CLUSTER_CONTEXT}-cluster" --server="https://${CLUSTER_HOST}:${CLUSTER_PORT}" --insecure-skip-tls-verify
          kubectl config set-credentials "${CLUSTER_CONTEXT}-user" --token "$SERVICE_ACCOUNT_TOKEN"
          kubectl config set-context "${CLUSTER_CONTEXT}-context" --cluster="${CLUSTER_CONTEXT}-cluster" --user="${CLUSTER_CONTEXT}-user" --namespace="$NAMESPACE"
          kubectl config use-context "${CLUSTER_CONTEXT}-context"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply resources
        run: |
          kubectl -n "$NAMESPACE" apply -k "k8s/env/${DEPLOYMENT_ENV}"

      - name: Patch secrets
        run: |
          kubectl create secret generic "secrets-${DEPLOYMENT_ENV}" \
            --from-literal=BACKEND_ADMIN_JWT_SECRET='${{ secrets.BACKEND_ADMIN_JWT_SECRET }}' \
            --from-literal=BACKEND_API_TOKEN_SALT='${{ secrets.BACKEND_API_TOKEN_SALT }}' \
            --from-literal=BACKEND_APP_KEYS='${{ secrets.BACKEND_APP_KEYS }}' \
            --from-literal=BACKEND_JWT_SECRET='${{ secrets.BACKEND_JWT_SECRET }}' \
            --from-literal=BACKEND_ENCRYPTION_KEY='${{ secrets.BACKEND_ENCRYPTION_KEY }}' \
            --from-literal=BACKEND_TRANSFER_TOKEN_SALT='${{ secrets.BACKEND_TRANSFER_TOKEN_SALT }}' \
            --from-literal=FRONTEND_NUXT_CMS_API_TOKEN='${{ secrets.FRONTEND_NUXT_CMS_API_TOKEN }}' \
            --dry-run=client -o yaml | kubectl -n "$NAMESPACE" apply -f -

      - name: Patch container images
        run: |
          tag="latest"
          if [[ "${{ needs.release.outputs.released }}" == "true" ]]; then
            tag="${{ needs.release.outputs.tag }}"
          elif [[ "${{ inputs.build }}" == "true" ]]; then
            tag="${{ github.sha }}"
          fi

          kubectl -n "$NAMESPACE" set image "deployment/frontend-${DEPLOYMENT_ENV}" frontend="${{ env.REGISTRY }}/${{ github.repository }}-frontend:${tag}"
          kubectl -n "$NAMESPACE" set image "deployment/backend-${DEPLOYMENT_ENV}" backend="${{ env.REGISTRY }}/${{ github.repository }}-backend:${tag}"

      - name: Restart deployments
        run: |
          kubectl rollout restart "deployment/frontend-${DEPLOYMENT_ENV}"
          kubectl rollout restart "deployment/backend-${DEPLOYMENT_ENV}"
