apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: prod

resources:
  - ../../common/
  - ingress.yaml

nameSuffix: -prod

labels:
  - includeSelectors: true
    pairs:
      env: prod
  - includeSelectors: true
    pairs:
      app: sam

patches:
  - path: overlay-configmap.yaml
