---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sam
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: defaultCertResolver
spec:
  ingressClassName: traefik
  rules:
    - host: dev.samdruant.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sam-frontend-dev
                port: frontend
    - host: dev-cms.samdruant.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sam-backend-dev
                port: backend
