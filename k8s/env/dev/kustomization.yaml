apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: dev

resources:
  - ../../common/
  - ingress.yaml

nameSuffix: -dev

labels:
  - includeSelectors: true
    pairs:
      env: dev
  - includeSelectors: true
    pairs:
      app: sam

patches:
  - path: overlay-configmap.yaml
