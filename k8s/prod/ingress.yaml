apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sam
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`samdruant.com`)
      kind: Rule
      services:
        - name: sam-frontend-prod
          port: frontend
    - match: Host(`cms.samdruant.com`)
      kind: Rule
      services:
        - name: sam-backend-prod
          port: backend
  tls:
    certResolver: defaultCertResolver
