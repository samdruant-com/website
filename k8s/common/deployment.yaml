---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sam-frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: frontend
          image: ghcr.io/samdruant-com/website-frontend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          env:
            - name: NUXT_API_URL
              valueFrom:
                configMapKeyRef:
                  name: sam
                  key: FRONTEND_NUXT_API_URL
            - name: NUXT_PUBLIC_MEDIA_URL
              valueFrom:
                configMapKeyRef:
                  name: sam
                  key: FRONTEND_NUXT_PUBLIC_MEDIA_URL
            - name: NUXT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sam
                  key: FRONTEND_NUXT_API_TOKEN
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 3
          ports:
            - containerPort: 3000
              name: frontend-port
          resources:
            limits:
              memory: 256Mi
              cpu: "0.5"
            requests:
              memory: 128Mi
              cpu: "0.1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sam-backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/samdruant-com/website-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: false
          env:
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sam
                  key: BACKEND_ADMIN_JWT_SECRET
            - name: API_TOKEN_SALT
              valueFrom:
                secretKeyRef:
                  name: sam
                  key: BACKEND_API_TOKEN_SALT
            - name: APP_KEYS
              valueFrom:
                secretKeyRef:
                  name: sam
                  key: BACKEND_APP_KEYS
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: sam
                  key: BACKEND_ENCRYPTION_KEY
            - name: TRANSFER_TOKEN_SALT
              valueFrom:
                secretKeyRef:
                  name: sam
                  key: BACKEND_TRANSFER_TOKEN_SALT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sam
                  key: BACKEND_JWT_SECRET
          livenessProbe:
            httpGet:
              path: /api
              port: 1337
            initialDelaySeconds: 15
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /api
              port: 1337
            initialDelaySeconds: 15
            periodSeconds: 30
          ports:
            - containerPort: 1337
              name: backend-port
          resources:
            requests:
              memory: 1Gi
              cpu: "0.25"
            limits:
              memory: 2Gi
              cpu: "1"
          volumeMounts:
            - name: database
              mountPath: /app/.database
            - name: media
              mountPath: /app/public/uploads
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: sam-database
        - name: media
          persistentVolumeClaim:
            claimName: sam-media
