---
apiVersion: v1
kind: Service
metadata:
  name: sam-frontend
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: frontend
      protocol: TCP
      port: 3000
      targetPort: frontend-port
---
apiVersion: v1
kind: Service
metadata:
  name: sam-backend
  labels:
    app: backend
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: backend
      protocol: TCP
      port: 1337
      targetPort: backend-port
