---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sam-media
  labels:
    app: backend
spec:
  storageClassName: homelab-hostpath
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sam-database
  labels:
    app: backend
spec:
  storageClassName: homelab-hostpath
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
