apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sam
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dev.samdruant.com`)
      kind: Rule
      services:
        - name: sam-frontend-dev
          port: frontend
    - match: Host(`dev-cms.samdruant.com`)
      kind: Rule
      services:
        - name: sam-frontend-dev
          port: backend
  tls:
    certResolver: defaultCertResolver
